# Agent permissions — what the agent may do without asking
allow:
  - read_files
  - edit_code
  - run_tests
  - run_clippy
ask:
  - add_dependency
  - modify_protected_files
  - change_storage_format
deny:
  - introduce_network_calls
  - add_cloud_telemetry
  - read_user_private_data
  - force_push
