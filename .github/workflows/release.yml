name: Windows Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    name: Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release

      - name: Prepare release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\Sticky Note" -Force
          Copy-Item "target\release\sticky-note.exe" "dist\Sticky Note\Sticky Note.exe"
          Copy-Item "target\release\sticky-note-settings.exe" "dist\Sticky Note\Sticky Note Settings.exe"
          Copy-Item "config.example.json" "dist\Sticky Note\config.json"
          Copy-Item "README.md" "dist\Sticky Note\"
          Copy-Item "LICENSE" "dist\Sticky Note\"
          Compress-Archive -Path "dist\Sticky Note\*" -DestinationPath "Sticky-Note-Windows-x64.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Sticky-Note-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
