[workspace]
resolver = "2"
members = [
    "crates/sticky-note-core",
    "crates/sticky-note",
    "crates/sticky-note-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Himal"]
license = "MIT"
repository = "https://github.com/001-Himal/StickyNotes.git"

[workspace.dependencies]
slint = "1.8"
slint-build = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
interprocess = "2.2"
global-hotkey = "0.5"
sticky-note-core = { path = "crates/sticky-note-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

